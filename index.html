<html lang="fr">

    background-color: #fdf6f0;

    scroll-behavior: smooth;

  header {
    position: sticky;

    font-size: 2em;
    vertical-align: middle;
    color: #fff;
  }
  nav {
    margin-top: 10px;
  }
  nav a {
    color: #fff;

    margin: 0 15px;
    font-size: 1.1em;
    padding: 5px 10px;
    border-radius: 5px;
    background-color: rgba(0,0,0,0.2);
    transition: background-color 0.3s;

  nav a:hover {
    background-color: rgba(0,0,0,0.5);
  }

    padding: 40px 20px;
  }
  h2 {

    margin-bottom: 20px;
  }
  .products {

    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }
  .product {
    background-color: #fff0f5;
    border-radius: 10px;
    padding: 15px;
    width: 220px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .product img {
    width: 100%;
    border-radius: 10px;
  }
  .price {
    font-weight: bold;
    color: #e63946;
    margin-top: 10px;
  }

    color: white;
    border-radius: 5px;
    cursor: pointer;
  }
